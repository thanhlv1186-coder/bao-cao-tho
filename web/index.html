<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>Báo cáo Thợ GHLĐ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BC Thợ GHLĐ">
<script src="config.js"></script>
<style>
:root{--bg:#eef3fa;--card:#ffffff;--card2:#f3f7fd;--line:#dde6f2;--tx:#1e293b;--mu:#5b6b82;--dim:#8a99ad;
--ok:#15803d;--okbg:#e3f6e9;--bad:#dc2626;--badbg:#fde8e8;--na:#64748b;--nabg:#eef2f7;
--ac:#1a73e8;--acbg:#e8f1fe;--hd:#1a73e8;--hd2:#2b86f0;--yl:#ffd400;--ylbg:#fff6cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--hd),var(--hd2));color:#fff;border-bottom:3px solid var(--yl);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.ttl{font-weight:700;font-size:16px;flex:1;letter-spacing:.2px}
.sub{color:var(--mu);font-size:12px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.icon svg{width:18px;height:18px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:8px}
.seg button{flex:1;padding:7px 0;border-radius:8px;color:var(--mu);font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#fff;box-shadow:0 -2px 10px rgba(30,64,120,.08);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:4px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .k{font-size:12.5px;color:var(--mu);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.kpi .v{font-size:24px;font-weight:700;margin:4px 0 2px}
.kpi .m{font-size:12px;color:var(--mu)}
.kpi .m b{color:var(--tx);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.c-ok{color:var(--ok);background:var(--okbg)}.c-bad{color:var(--bad);background:var(--badbg)}.c-na{color:var(--mu);background:var(--nabg)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:6px}
.bar .t{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx);opacity:.6}
h3{font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{flex:1;min-width:0}
.row .n div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:13px}
.list .row{cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mu);font-size:13px;font-weight:600}
.chips button.on{border-color:var(--ac);color:var(--ac);background:var(--acbg)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mini div{background:var(--card2);border-radius:8px;padding:5px 7px;font-size:11px;color:var(--mu)}
.mini b{display:block;font-size:13.5px;color:var(--tx);margin-top:1px}
.mini .bad b{color:var(--bad)}.mini .ok b{color:var(--ok)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.stat div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.stat div span:first-child{color:var(--mu)}
.stat div:nth-child(-n+2){border-top:0}
input[type=search],input[type=password],.login input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none}
input:focus{border-color:var(--ac)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ac);font-weight:600;margin-bottom:8px;padding:4px 0}
.warn{background:var(--ylbg);color:#8a5a00;border:1px solid #f5d76e;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:10px;white-space:pre-line}
.upd{background:var(--acbg);border:1px solid #b9d4fb;color:var(--ac);border-radius:10px;padding:9px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.upd a{color:var(--tx);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--mu);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login h1{font-size:22px;margin:0 0 4px}
.btn{width:100%;margin-top:12px;padding:12px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.empty{color:var(--dim);text-align:center;padding:24px 0;font-size:13px}
.sel{display:flex;gap:8px;margin-bottom:10px}
.sel select{flex:none;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card2);color:var(--mu);flex:none}
.stk{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:8px}
.stk i{display:block;height:100%}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.lg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tri div{background:var(--card2);border-radius:10px;padding:8px 10px;border-top:3px solid var(--c)}
.tri small{display:block;font-size:11px;color:var(--mu)}
.tri b{font-size:18px}
.tri em{font-style:normal;font-size:11.5px;color:var(--mu)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.lnk{display:block;text-align:center;color:var(--ac);font-weight:600;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
.rk.hot{background:var(--badbg);color:var(--bad)}
.sharebtn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:13px;border:0}
.imgov{position:fixed;inset:0;z-index:50;background:rgba(2,8,23,.94);display:flex;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch}
.imgov-bar{position:sticky;top:0;display:flex;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(2,8,23,.85);backdrop-filter:blur(6px)}
.imgov-bar button,.imgov-bar a,.imgov-acts button,.imgov-acts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px 6px;border-radius:10px;font-weight:700;font-size:14px;border:0;text-decoration:none;color:#fff}
.imgov-x{background:#334155}.imgov-dl{background:var(--ac)}
.imgov-acts{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(2,8,23,.9);backdrop-filter:blur(6px);margin-top:auto}
.b-line{background:#06c755}.b-zalo{background:#0068ff}.b-more{background:#475569}
.imgov-tip{color:#cbd5e1;font-size:13px;text-align:center;padding:4px 16px 12px}.imgov-tip a{color:#ffd400}
.imgov-wrap{padding:0 10px 16px}.imgov-wrap img{width:100%;border-radius:10px;display:block}

header .sub{color:rgba(255,255,255,.85)}
header .icon{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
header .seg{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
header .seg button{color:rgba(255,255,255,.85)}
header .seg button.on{background:#fff;color:var(--hd);box-shadow:none}
.card{box-shadow:0 1px 3px rgba(30,64,120,.08)}
.kpi .k span:first-child{color:var(--hd);font-weight:700}
th{background:var(--hd);color:#fff}
table thead th:first-child{border-top-left-radius:8px}table thead th:last-child{border-top-right-radius:8px}
tbody tr:nth-child(even) td{background:#f7faff}
.rk{background:var(--ylbg);color:#8a5a00}
.chips button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.login h1{color:var(--hd)}
.toast{color:#fff;background:#1e293b;border-color:#1e293b}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const CFG = window.APP_CFG || {repo:'', ver:0};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const IC = {
  ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  tq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  cn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>',
  dh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>',
  tho:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  th:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>'
};
let S = {data:null, vi: +(LS.get('vi')||0), kpi: +(LS.get('kpi')||1), mk: +(LS.get('mk')||1), sortTho: LS.get('st')||'risk', q:'', loading:false, newVer:null};

/* ------------------------------------------------ dữ liệu: tải + giải mã */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.it, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
  const st = new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(st).text());
}
async function fetchEnc(){
  const urls = [
    [`https://raw.githubusercontent.com/${CFG.repo}/main/data/app.json?t=${Date.now()}`, {}],
    [`https://api.github.com/repos/${CFG.repo}/contents/data/app.json?t=${Date.now()}`, {headers:{Accept:'application/vnd.github.raw+json'}}]
  ];
  let last;
  for (const [u, o] of urls){
    try { const r = await fetch(u, {cache:'no-store', ...o}); if (r.ok) return await r.text(); last = 'HTTP ' + r.status; }
    catch(e){ last = e.message; }
  }
  throw new Error(last || 'mất kết nối');
}
async function load(pw, quiet){
  S.loading = true; spin(true);
  let txt = null, online = true;
  try { txt = await fetchEnc(); }
  catch(e){ online = false; txt = LS.get('enc'); if (!txt) { spin(false); S.loading = false; throw new Error('Không tải được dữ liệu (' + e.message + ')'); } }
  const enc = JSON.parse(txt);
  const d = await decrypt(enc, pw);           // sai mật khẩu -> lỗi
  const changed = !S.data || S.data.updated !== d.updated;
  S.data = d; LS.set('enc', txt); LS.set('pw', pw);
  S.loading = false; spin(false);
  if (!quiet || changed) toast(online ? (changed && S.data ? 'Dữ liệu ' + d.updated : 'Đã là dữ liệu mới nhất') : 'Đang offline – dữ liệu ' + d.updated);
  render();
}
function refresh(quiet){ const pw = LS.get('pw'); if (pw && !S.loading) load(pw, quiet).catch(e => toast(e.message)); }
async function checkVer(){
  if (!CFG.repo || !CFG.ver) return;
  try { const r = await fetch(`https://api.github.com/repos/${CFG.repo}/releases/latest`); if (!r.ok) return;
    const j = await r.json(); const v = parseInt(String(j.tag_name||'').replace(/\D/g,''));
    if (v > CFG.ver){ S.newVer = {v, url:`https://github.com/${CFG.repo}/releases/latest/download/BaoCaoTho.apk`}; render(); } } catch(e){}
}

/* ------------------------------------------------ định dạng (theo NumberFormat của Excel) */
function fmtX(v, f, gi, si){
  if (v === null || v === undefined || v === '') return '–';
  if (typeof v === 'string') return v;
  f = f || guessFmt(gi, si);
  if (f.includes('%')){ const d = ((f.match(/\.(0+)/)||[,''])[1]).length; return (v*100).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d}) + '%'; }
  const d = f === 'General' ? (Number.isInteger(v) ? 0 : 2) : ((f.match(/\.(0+)/)||[,''])[1]).length;
  return v.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function guessFmt(gi, si){                     // khi không có định dạng Excel
  if (gi === 5) return si === 4 ? '0.0%' : '#,##0';
  if (si === 2) return '0.0%';                 // %HT / Lũy kế
  if (gi === 0) return '#,##0';
  if (gi === 3) return '0.00';
  return '0.00%';
}
const chipCls = t => /^Đạt/.test(t||'') ? 'c-ok' : /^Chưa đạt/.test(t||'') ? 'c-bad' : 'c-na';
const chip = t => `<span class="chip ${chipCls(t)}">${esc(t||'–')}</span>`;

/* ------------------------------------------------ truy cập dữ liệu */
const BC = () => (S.data.bc[S.vi] || S.data.bc[0]);
function grp(row, gi, fmts, labs){
  const b = BC(), g = b.groups[gi], c0 = g.c0, n = g.n, out = [];
  for (let i = 0; i < n; i++) out.push({lab: labs[c0+i], v: row[c0+i], txt: fmtX(row[c0+i], fmts[c0+i], gi, i)});
  return {name: (g.name||'').trim(), mt: out[0], tt: out[1], items: out, dg: out[n-1].v, ht: n === 6 ? out[4] : out[2]};
}
const kName = gi => (BC().groups[gi].name||'').replace(/^[^\wÀ-ỹ]+/u,'').trim();
function U(){ const u = S.data.users; const ix = {}; u.cols.forEach((c,i) => ix[c] = i); return {rows:u.rows, ix, cols:u.cols}; }
const userRows = () => { const {rows, ix} = U(); return rows.filter(r => r[ix['Vùng rút gọn']] === BC().vung); };

function fmtU(col, v){
  if (v === null || v === undefined) return '–';
  if (typeof v !== 'number') return esc(v);
  if (/^%/.test(col)) return (v*100).toLocaleString('vi-VN',{maximumFractionDigits:1}) + '%';
  if (/Sao/.test(col)) return v.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString('vi-VN',{maximumFractionDigits:2});
}

/* ------------------------------------------------ giao diện */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function spin(on){ const b = $('#rf'); if (b) b.classList.toggle('spin', on); }
function route(){ const h = (location.hash||'#tq').slice(1).split('/'); return {v:h[0]||'tq', id: h[1] ? decodeURIComponent(h.slice(1).join('/')) : null}; }

function iosHint(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  return ios && !standalone ? `<div class="warn" style="margin-top:16px;background:var(--acbg);color:var(--hd);border-color:#b9d4fb">📲 Cài lên iPhone: bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên ở thanh dưới Safari) → <b>Thêm vào MH chính</b> → <b>Thêm</b>. Lần sau mở app từ biểu tượng trên màn hình.</div>` : '';
}
function loginView(msg){
  $('#app').innerHTML = `<div class="login">
    <div class="sub" style="margin-bottom:6px">Điện Máy Xanh · Thợ GHLĐ</div>
    <h1>Báo cáo Thợ GHLĐ</h1>
    <div class="sub" style="margin-bottom:18px">Nhập mật khẩu được cấp để xem báo cáo</div>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn" id="go">Xem báo cáo</button>
    <div class="err" id="er">${esc(msg||'')}</div>${iosHint()}</div>`;
  const go = async () => { const pw = $('#pw').value; if (!pw) return; $('#go').textContent = 'Đang tải…';
    try { await load(pw); } catch(e){ loginView(/decrypt|operation|OperationError/i.test(e.name + e.message) ? 'Sai mật khẩu' : e.message); } };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pw').focus();
}

function shell(body){
  const d = S.data, r = route();
  const tabs = [['tq','Tổng quan',IC.tq],['cn','Chi nhánh',IC.cn],['dh','Đơn hàng',IC.dh],['tho','Thợ',IC.tho],['th','Theo tháng',IC.th]];
  return `<header><div class="hrow"><div style="flex:1;min-width:0"><div class="ttl">BÁO CÁO THỢ GHLĐ</div>
      <div class="sub num">${esc(d.ky)} · cập nhật ${esc(d.updated)}</div></div>

function kpiCard(row, gi, big){

  const col = chipCls(g.dg) === 'c-ok' ? 'var(--ok)' : chipCls(g.dg) === 'c-bad' ? 'var(--bad)' : 'var(--na)';
  const extra = g.items.slice(2, -1).filter(x => x !== g.ht).map(x => `${esc(x.lab)} <b class="num">${x.txt}</b>`).join(' · ');
  return `<div class="card kpi"><div class="k"><span>${esc(g.name)}</span>${chip(g.dg)}</div>
    <div class="v num">${g.tt.txt}</div>

}

function viewTQ(){
  const b = BC(), lines = [];
  for (let gi = 1; gi < b.groups.length; gi++){
    const rows = b.cn.map(r => ({r, g: grp(r, gi, b.fmt_d, b.lab_d)}));
    const bad = rows.filter(x => chipCls(x.g.dg) === 'c-bad').length;
    rows.sort((x, y) => (typeof x.g.ht.v === 'number' ? x.g.ht.v : 9) - (typeof y.g.ht.v === 'number' ? y.g.ht.v : 9));
    if (gi === 4) rows.reverse();          // hủy nhập trả: %HT thấp là tốt
    lines.push(`<div class="card"><div class="kpi"><div class="k"><span style="color:var(--tx);font-weight:600">${esc(b.groups[gi].name)}</span>

      <div class="list" style="margin-top:4px">${rows.map(({r, g}) =>
        `<div class="row" data-cn="${esc(r[1])}"><div class="n"><div>${esc(r[1])}</div></div>
          <div class="r num" style="display:flex;align-items:center;gap:8px;justify-content:flex-end">${g.tt.txt} <span class="sub">/ MT ${g.mt.txt}</span>${chip(g.dg)}</div></div>`).join('')}</div></div>`);

/* ---------------- Chia sẻ ảnh báo cáo chi nhánh (vẽ ngay trên máy, không lưu server) */
function roundRect(x, l, t, w, h, r){ x.beginPath(); x.moveTo(l+r,t); x.arcTo(l+w,t,l+w,t+h,r); x.arcTo(l+w,t+h,l,t+h,r); x.arcTo(l,t+h,l,t,r); x.arcTo(l,t,l+w,t,r); x.closePath(); }
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').replace(/[^\w]+/g,'_'); }
const chipCol = cc => cc === 'c-ok' ? ['#15803d','#e3f6e9'] : cc === 'c-bad' ? ['#dc2626','#fde8e8'] : ['#64748b','#eef2f7'];
function drawTiles(x, left, top, width, items){
  const n = items.length, gap = 14, tw = (width - (n - 1) * gap) / n, th = 160;
  items.forEach((it, idx) => {
    const tl = left + idx * (tw + gap);
    roundRect(x, tl, top, tw, th, 14); x.fillStyle = '#fff'; x.fill();
    x.textAlign = 'left'; x.textBaseline = 'top';
    x.fillStyle = '#5b6b82'; x.font = '19px sans-serif'; x.fillText(it.lab, tl + 18, top + 16, tw - 28);
    x.fillStyle = it.vc || '#1e293b'; x.font = 'bold 40px sans-serif'; x.fillText(it.val, tl + 18, top + 50);
    if (it.sub){ x.fillStyle = '#8a99ad'; x.font = '18px sans-serif'; x.fillText(it.sub, tl + 18, top + 104); }
    if (it.chip){ const [col, bg] = chipCol(it.cc); x.font = 'bold 18px sans-serif';
      const cw = x.measureText(it.chip).width + 24; roundRect(x, tl + 18, top + 124, cw, 28, 14); x.fillStyle = bg; x.fill();
      x.fillStyle = col; x.fillText(it.chip, tl + 30, top + 130); }
  });
  return top + th;
}
function drawTable(x, left, top, width, cols, rows){
  const hh = 46, rh = 42; let cx = left;
  roundRect(x, left, top, width, hh, 8); x.fillStyle = '#1a73e8'; x.fill();
  x.fillStyle = '#fff'; x.font = 'bold 21px sans-serif'; x.textBaseline = 'middle';
  cols.forEach(c => { x.textAlign = c.a || 'left'; const tx = c.a === 'right' ? cx + c.w - 14 : cx + 14; x.fillText(c.t, tx, top + hh / 2); cx += c.w; });
  let y = top + hh;
  rows.forEach((row, ri) => {
    x.fillStyle = ri % 2 ? '#f5f8fe' : '#ffffff'; x.fillRect(left, y, width, rh);
    cx = left;
    row.forEach((cell, ci) => { const c = cols[ci]; x.font = (cell.b ? 'bold ' : '') + '20px sans-serif'; x.fillStyle = cell.c || '#1e293b';
      x.textAlign = c.a || 'left'; const tx = c.a === 'right' ? cx + c.w - 14 : cx + 14; x.fillText(String(cell.t), tx, y + rh / 2, c.w - 20); cx += c.w; });
    y += rh;
  });
  x.strokeStyle = '#e2e8f0'; x.lineWidth = 1; x.strokeRect(left + .5, top + .5, width - 1, y - top - 1);
  x.textAlign = 'left'; x.textBaseline = 'top';
  return y;
}
function drawShareCanvas(name){
  const b = BC(); const r = b.cn.find(x => x[1] === name) || (b.total[1] === name ? b.total : null);
  if (!r) return null;
  const Q = gi => grp(r, gi, b.fmt_d, b.lab_d);
  const { rows: xr, ix: xi } = XE();
  const kho = xr.filter(z => z[xi['Cấp']] === 'KHO' && z[xi['Chi nhánh']] === name);
  const don = agg(kho, xi);
  const { rows: ur, ix: ui } = U();
  const us = ur.filter(u => u[ui['Chi nhánh']] === name && u[ui['Vùng rút gọn']] === b.vung);
  const sum = c => us.reduce((s, u) => s + (u[ui[c]] || 0), 0);
  const treHen = sum('Đơn trễ hẹn'), tongLoi = sum('Tổng lỗi TN');
  const l1065 = sum('Lỗi TN 1065'), l1063 = sum('Lỗi TN 1063'), l1025 = sum('Lỗi TN ĐH 1025');
  const dtThuan = sum('Doanh thu thuần'), soDonBan = sum('Số đơn bán');
  const soThoBan = us.filter(u => (u[ui['Doanh thu thuần']] || 0) > 0).length;
  const L = S.data.loi, li = {}; L.cols.forEach((c, k) => li[c] = k);
  const loiRows = L.rows.filter(z => z[li['Cấp']] === 'KHO' && z[li['Chi nhánh']] === name && z[li['Vùng rút gọn']] === b.vung).sort((a, c) => c[li['Số lỗi']] - a[li['Số lỗi']]);
  const risky = us.filter(u => (u[ui['Điểm rủi ro']] || 0) > 0).sort((a, c) => (c[ui['Điểm rủi ro']] || 0) - (a[ui['Điểm rủi ro']] || 0)).slice(0, 10);
  const uall = us.slice().sort((a, c) => (c[ui['Đơn TC (3268)']] || 0) - (a[ui['Đơn TC (3268)']] || 0)).slice(0, 60);
  const g5 = Q(5), g3 = Q(3);
  const mtV = typeof g5.mt.v === 'number' ? g5.mt.v : null;           // mục tiêu doanh số (nghìn đồng)
  const saoTarget = typeof g3.mt.v === 'number' ? g3.mt.v : null;     // mục tiêu sao phục vụ của chi nhánh
  const p1 = v => v == null ? '–' : (v * 100).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '%';
  const sao = v => (v == null || v === '') ? '–' : Number(v).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const saoC = v => (saoTarget != null && typeof v === 'number' && v > 0 && v < saoTarget) ? '#dc2626' : '#1e293b';

  // ---- Bố cục NGANG (khổ rộng) ----
  const W = 2000, P = 48, iw = W - 2 * P, gap = 40, Lw = 1180, Rx = P + Lw + gap, Rw = iw - Lw - gap;
  const loiH = loiRows.length ? 46 + loiRows.length * 42 : 0;
  let H = 200 + 20 + (56 + 150 + 20) + (56 + Math.max(150, loiH) + 20) + (56 + 150 + 20);
  if (mtV) H += 40;
  if (risky.length) H += 56 + 46 + risky.length * 42 + 20;
  H += 56 + 46 + uall.length * 42 + 30 + 50;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.textBaseline = 'top';

  const sec = t => { secAt(t, P); y += 48; };

  sec('1. ĐƠN HÀNG THÁNG (giao thành công)');
  y = drawTiles(x, P, y, iw, [
    { lab: 'TỔNG ĐƠN', val: n0(don.tong) },

  ]) + 20;

  // Hàng 2: CHẤT LƯỢNG (trái) + NHÓM HÀNG LỖI (phải)
  secAt('2. CHẤT LƯỢNG', P); if (loiRows.length) secAt('NHÓM HÀNG LỖI TAY NGHỀ', Rx); y += 48;
  const qTile = (lab, gi) => { const g = Q(gi); return { lab, val: g.tt.txt, sub: 'MT ' + g.mt.txt, chip: g.dg, cc: chipCls(g.dg) }; };
  const yL = drawTiles(x, P, y, Lw, [

  let yR = y;

    loiRows.map(z => [{ t: z[li['Nhóm hàng']] }, { t: n0(z[li['Số lỗi']]), b: true, c: '#dc2626' }]));
  y = Math.max(yL, yR) + 20;

    y = drawTable(x, P, y, iw,
      [{ t: '#', w: 70, a: 'right' }, { t: 'User', w: 480, a: 'left' }, { t: 'Sao phục vụ', w: 220, a: 'right' }, { t: 'Đơn trễ hẹn', w: 220, a: 'right' },

      risky.map((u, k) => [{ t: k + 1, c: '#dc2626', b: true }, { t: uname(u), b: true }, { t: sao(u[ui['Sao phục vụ']]), c: saoC(u[ui['Sao phục vụ']]) }, { t: n0(u[ui['Đơn trễ hẹn']]) },
        { t: p1(u[ui['% Đúng hẹn']]) }, { t: n0(u[ui['Tổng lỗi TN']]) }, { t: p1(u[ui['% Tay nghề (/đơn TC)']]) },
        { t: n0(u[ui['Điểm rủi ro']]), b: true, c: rrCol(u[ui['Điểm rủi ro']]) }])) + 20;
  }

  sec('5. DANH SÁCH USER (' + us.length + ' user)');

  y = drawTable(x, P, y, iw, uc, uall.map(u => [{ t: uname(u) }, { t: n0(u[ui['Đơn TC (3268)']]) }, { t: n0(u[ui['Đơn xe máy']]) },
    { t: n0(u[ui['Đơn xe tải']]) }, { t: sao(u[ui['Sao phục vụ']]), c: saoC(u[ui['Sao phục vụ']]) }, { t: n0(u[ui['Đơn trễ hẹn']]), c: u[ui['Đơn trễ hẹn']] ? '#dc2626' : '#1e293b' }, { t: p1(u[ui['% Đúng hẹn']]) },
    { t: n0(u[ui['Tổng lỗi TN']]), c: u[ui['Tổng lỗi TN']] ? '#dc2626' : '#1e293b' }, { t: p1(u[ui['% Tay nghề (/đơn TC)']]) },
    { t: n0(u[ui['Doanh thu thuần']]) }, { t: n0(u[ui['Điểm rủi ro']]), b: true, c: rrCol(u[ui['Điểm rủi ro']]) }]));
  y += 12;
  x.fillStyle = '#8a99ad'; x.font = '22px sans-serif'; x.textAlign = 'left'; x.textBaseline = 'top';
  x.fillText('App Báo cáo Thợ GHLĐ · xuất ' + new Date().toLocaleString('vi-VN'), P, y);

}

/* ---------------- Thống kê sử dụng: mỗi lần mở app gửi 1 dòng về Google Sheet (Apps Script) */
const LOG_URL = 'https://script.google.com/macros/s/AKfycbyBsGSKTNq_eDRyYIdwrEWndHXT8jyjv1TFPfsxOfozRKXhH6zkiMSJZ4P3NwV93ppB/exec';   // Google Apps Script nhận log
function devId(){ let d = LS.get('did'); if (!d){ d = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toUpperCase(); LS.set('did', d); } return d; }
async function uaInfo(){
  const ua = navigator.userAgent;
  let platform = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Khác';
  let model = '';
  // Model thật qua UA Client Hints (Chrome/Android đời mới giấu model trong UA = "K")
  try {
    const uad = navigator.userAgentData;
    if (uad && uad.getHighEntropyValues){
      const h = await uad.getHighEntropyValues(['model','platform']);
      if (h.platform){ platform = h.platform === 'macOS' ? 'Mac' : h.platform; }
      if (h.model) model = h.model;
    }
  } catch(e){}
  if (!model || model === 'K'){            // dự phòng: lấy từ User-Agent
    if (platform === 'Android'){ const m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|[;)])/); model = m && m[1].trim() !== 'K' ? m[1].trim() : ''; }
    else if (platform === 'iOS'){ model = (ua.match(/iPhone|iPad|iPod/) || [''])[0]; }
  }
  const browser = /SamsungBrowser/.test(ua) ? 'Samsung' : /EdgiOS|Edg/.test(ua) ? 'Edge' : /CriOS|Chrome/.test(ua) ? 'Chrome' : /FxiOS|Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : 'Khác';
  const pwa = (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'App (MH chính)' : 'Trình duyệt';
  return {ua, platform, model, browser, pwa};
}
async function sendLog(){          // JSONP: ghi nhận máy + nhận lệnh khóa/mở từ trang giám sát
  if (!LOG_URL) return;
  try {
    const i = await uaInfo();
    const cb = '__bc' + Date.now();
    const p = new URLSearchParams({ callback: cb, did: devId(), name: LS.get('uname') || '', manv: LS.get('umnv') || '',
      platform: i.platform, model: i.model, browser: i.browser, pwa: i.pwa, region: S.data ? BC().vung : '',
      ver: String(CFG.ver || (/github\.io$/.test(location.hostname) ? 'Web' : '')) });
    const s = document.createElement('script');
    const done = () => { try { delete window[cb]; } catch(e){} try { s.remove(); } catch(e){} };
    window[cb] = res => { done(); if (res && res.locked){ S.locked = true; LS.del('enc'); lockedView(); } };
    s.onerror = done; s.src = LOG_URL + '?' + p.toString();
    document.head.appendChild(s); setTimeout(done, 15000);
  } catch(e){}
}
function logOpen(){ if (S._logged) return; S._logged = true; sendLog(); }

  if (t.id === 'rf') return refresh(false);
  if (t.id === 'me') return nameForm(true);
  if (t.id === 'lo') { LS.del('pw'); LS.del('enc'); S.data = null; return loginView(); }
  if (t.dataset.vi !== undefined) { S.vi = +t.dataset.vi; LS.set('vi', S.vi); const r = route(); if (r.id) location.hash = r.v; else render(); return; }
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.kpi !== undefined) { S.kpi = +t.dataset.kpi; LS.set('kpi', S.kpi); return render(); }
  if (t.dataset.mk !== undefined) { S.mk = +t.dataset.mk; LS.set('mk', S.mk); return render(); }
  if (t.dataset.dh) { location.hash = 'dh/' + encodeURIComponent(t.dataset.dh); return; }
  if (t.dataset.cn) { location.hash = 'cn/' + encodeURIComponent(t.dataset.cn); return; }
  if (t.dataset.tho) { location.hash = 'tho/' + encodeURIComponent(t.dataset.tho); return; }
  if (t.dataset.back !== undefined) { history.length > 1 ? history.back() : (location.hash = route().v); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
document.addEventListener('change', e => { if (e.target.id === 'st') { S.sortTho = e.target.value; LS.set('st', S.sortTho); render(); } });
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
setInterval(() => { if (!document.hidden) refresh(true); }, 10 * 60 * 1000);

if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
(async function start(){
  if (!CFG.repo) { $('#app').innerHTML = '<div class="login"><h1>Thiếu cấu hình</h1><div class="sub">config.js chưa có tên kho GitHub.</div></div>'; return; }
  const pw = LS.get('pw'), cached = LS.get('enc');
  if (pw && cached) { try { S.data = await decrypt(JSON.parse(cached), pw); render(); } catch(e){} }
  if (pw) { try { await load(pw, true); } catch(e){ if (!S.data) loginView(e.message); else toast(e.message); } }
  else loginView();
  checkVer();
})();
</script>
