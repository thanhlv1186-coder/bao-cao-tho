<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e6ecf5;
 font:15px/1.45 Inter,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.card{width:100%;max-width:360px;background:#121b2e;border:1px solid #24314d;border-radius:16px;padding:26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}

label{display:block;font-size:13px;color:#8fa0bd;margin-bottom:6px}

input[type=password]:focus{border-color:#1677d2}
.rm{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:#aab6cf}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#1677d2;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:10px;font-size:13px;color:#f87171;text-align:center}

async function moKhoa(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
async function thu(pw,nho){
