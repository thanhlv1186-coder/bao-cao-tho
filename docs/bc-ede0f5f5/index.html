<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1425;color:#e6ecf5;
 font:15px/1.45 Inter,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.card{width:100%;max-width:360px;background:#171d31;border:1px solid #2d3657;border-radius:16px;padding:26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.hd{background:#1e263e;border:1px solid #2d3657;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.hd b{display:block;font-size:17px;color:#efe86d}.hd span{font-size:12.5px;color:#aab6cf}
label{display:block;font-size:13px;color:#8fa0bd;margin-bottom:6px}
input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2d3657;background:#1e263e;color:#fff;font-size:16px;outline:none}
input[type=password]:focus{border-color:#4170ba}
.rm{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:#aab6cf}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#4170ba;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:10px;font-size:13px;color:#f87171;text-align:center}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function moKhoa(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
async function thu(pw,nho){
  const bt=document.getElementById('bt'),er=document.getElementById('er');
  bt.disabled=true;er.textContent='Đang mở…';
  try{await moKhoa(pw);try{nho?localStorage.setItem(K,pw):localStorage.removeItem(K)}catch(e){}}
  catch(e){bt.disabled=false;er.textContent='Sai mật khẩu, vui lòng thử lại.';try{localStorage.removeItem(K)}catch(x){}}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const p=document.getElementById('pw').value;if(p)thu(p,document.getElementById('nho').checked)};
