name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/**']   # web/** cap nhat tu xa, khong can build lai APK
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copy web into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/* android/app/src/main/assets/
          echo "window.APP_CFG={repo:'${{ github.repository }}',ver:${{ github.run_number }}};" > android/app/src/main/assets/config.js
      - name: Build
        working-directory: android
        env: { VCODE: '${{ github.run_number }}' }
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk BaoCaoTho.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: App Báo cáo Thợ GHLĐ v${{ github.run_number }}
          files: BaoCaoTho.apk
          make_latest: true
